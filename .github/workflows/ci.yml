name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Fast test suite (offline, no pilot archive)
        run: python -m pytest tests -q

      - name: Architecture boundaries
        run: lint-imports

      - name: Lint (ingestion + contracts scope)
        run: python -m ruff check src/ultrafast_ingestion src/ultrafast_e2p/application/prior_artifact.py

      - name: Lint (release scope: demo main chain, RF-8)
        run: python -m ruff check src/ultrafast_ingestion src/ultrafast_cfa src/ultrafast_interaction src/ultrafast_reconstructibility src/ultrafast_physics src/ultrafast_e2p src/ultrafast_bo demo

      - name: Pilot suite (requires archive; skipped when unavailable)
        run: python -m pytest tests -m pilot -q

      - name: Typecheck (stdlib-level)
        run: |
          python -m pip install mypy
          python -m mypy src/ultrafast_ingestion --ignore-missing-imports

      - name: Typecheck (release scope: demo main chain, RF-8)
        run: |
          python -m pip install mypy
          python -m mypy --explicit-package-bases src/ultrafast_ingestion src/ultrafast_cfa src/ultrafast_interaction src/ultrafast_reconstructibility demo/t2_slice --ignore-missing-imports
