[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrafast-process-learning"
version = "0.1.0"
description = "Ultrafast laser process learning, evidence adaptation and calibrated faceted applicability kernel (V2 brownfield migration)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.5",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "scikit-learn==1.7.2",
  "httpx==0.28.1",
  "fastapi==0.141.1",
  "uvicorn==0.30.0",
  "sqlalchemy==2.0.51",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1",
  "fastapi==0.141.1",
  "uvicorn==0.30.0", "ruff==0.16.1", "import-linter==2.13", "pymupdf==1.28.2", "mypy==1.17.1", "pyyaml==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not pilot and not benchmark'"
markers = [
    "unit: fast offline tests without external fixtures",
    "integration: multi-component tests",
    "pilot: requires the pilot PDF archive (5 papers); skipped when missing",
    "benchmark: evaluation jobs, not part of default CI",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100


